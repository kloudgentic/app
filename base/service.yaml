apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: sample-app
  labels:
    app: nginx
    app.kubernetes.io/name: nginx
    app.kubernetes.io/part-of: sample-app
    managed-by: agie-gitops
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
