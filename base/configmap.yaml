apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: sample-app
  labels:
    app: nginx
    managed-by: agie-gitops
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location /health {
            access_log off;
            return 200 '{"status":"healthy"}';
            add_header Content-Type application/json;
        }

        location /info {
            access_log off;
            return 200 '{"app":"sample-app","version":"1.0.0","managed_by":"agie-gitops"}';
            add_header Content-Type application/json;
        }
    }

  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sample App — AGIE GitOps</title>
        <style>
            body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                   max-width: 600px; margin: 80px auto; padding: 20px;
                   background: #0f172a; color: #e2e8f0; }
            h1 { color: #38bdf8; }
            .badge { display: inline-block; padding: 4px 12px; border-radius: 12px;
                     background: #22c55e; color: #fff; font-size: 14px; }
            .info { background: #1e293b; padding: 16px; border-radius: 8px; margin-top: 20px; }
            .info dt { color: #94a3b8; font-size: 13px; margin-top: 8px; }
            .info dd { color: #f1f5f9; margin: 2px 0 0 0; }
        </style>
    </head>
    <body>
        <h1>🚀 Sample Application</h1>
        <p><span class="badge">Deployed by AGIE GitOps</span></p>
        <p>This application is managed and deployed automatically by the AGIE platform's
           GitOps engine. Any changes pushed to the linked Git repository will be
           detected, synced, and deployed within seconds.</p>
        <dl class="info">
            <dt>Application</dt>     <dd>sample-app</dd>
            <dt>Version</dt>         <dd>1.0.0</dd>
            <dt>Environment</dt>     <dd>development</dd>
            <dt>Managed By</dt>      <dd>AGIE GitOps Engine</dd>
            <dt>Repository</dt>      <dd>github.com/kloudgentic/app</dd>
        </dl>
    </body>
    </html>
